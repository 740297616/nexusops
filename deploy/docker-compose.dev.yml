services:
  web:
    build:
      target: development
    environment:
      VITE_PROXY_TARGET: http://server:8080
      CHOKIDAR_USEPOLLING: "true"
    command: ["sh", "-c", "pnpm install --frozen-lockfile && exec pnpm dev --host 0.0.0.0 --port 80 --strictPort"]
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 60s

volumes:
  web_node_modules:
