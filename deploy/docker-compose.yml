services:
  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in deploy/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    image: ${COMPOSE_PROJECT_NAME:-nexusops}-server:1.3
    build:
      context: ../server
    restart: unless-stopped
    stop_grace_period: 20s
    environment: &server_environment
      NEXUSOPS_SERVER_ADDR: :8080
      NEXUSOPS_VERSION: ${NEXUSOPS_VERSION:-0.1.0}
      GIN_MODE: release
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?Set DB_USER in deploy/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in deploy/.env}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5s}
      NEXUSOPS_TRUSTED_PROXY_CIDRS: ${NEXUSOPS_TRUSTED_PROXY_CIDRS:-}
      AUTH_RATE_LIMIT_IP_MAX: ${AUTH_RATE_LIMIT_IP_MAX:-20}
      AUTH_RATE_LIMIT_ACCOUNT_MAX: ${AUTH_RATE_LIMIT_ACCOUNT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-1m}
      AUTH_CLEANUP_INTERVAL: ${AUTH_CLEANUP_INTERVAL:-1h}
      AUTH_SESSION_RETENTION: ${AUTH_SESSION_RETENTION:-24h}
      AUTH_AUDIT_RETENTION: ${AUTH_AUDIT_RETENTION:-2160h}
      AGENT_HEARTBEAT_TIMEOUT: ${AGENT_HEARTBEAT_TIMEOUT:-2m}
      AGENT_REGISTRATION_TTL: ${AGENT_REGISTRATION_TTL:-15m}
      AGENT_RATE_LIMIT_WINDOW: ${AGENT_RATE_LIMIT_WINDOW:-1m}
      AGENT_REGISTER_RATE_LIMIT: ${AGENT_REGISTER_RATE_LIMIT:-10}
      AGENT_HEARTBEAT_RATE_LIMIT: ${AGENT_HEARTBEAT_RATE_LIMIT:-120}
      AGENT_REPORT_RATE_LIMIT: ${AGENT_REPORT_RATE_LIMIT:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - database

  web:
    image: ${COMPOSE_PROJECT_NAME:-nexusops}-web:1.3
    build:
      context: ../web
      target: production
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    profiles: ["tools"]
    image: ${COMPOSE_PROJECT_NAME:-nexusops}-migrate:1.3
    build:
      context: ../server
    entrypoint: ["/usr/local/bin/nexusops-migrate"]
    command: ["status"]
    restart: "no"
    environment: *server_environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    healthcheck:
      disable: true

networks:
  frontend:
  database:
    internal: true

volumes:
  postgres_data: